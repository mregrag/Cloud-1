
name: Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Install Ansible Docker collection
        run: ansible-galaxy collection install community.docker

      - name: Verify Ansible collection
        run: ansible-galaxy collection list community.docker

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Prepare SSL private key
        env:
          SSL_PRIVATE_KEY: ${{ secrets.NGINX_SSL_PRIVATE_KEY }}
        run: |
          test -n "$SSL_PRIVATE_KEY" || {
            echo "NGINX_SSL_PRIVATE_KEY secret is missing"
            exit 1
          }

          mkdir -p srcs/requirements/nginx/ssl
          printf '%s\n' "$SSL_PRIVATE_KEY" > srcs/requirements/nginx/ssl/nginx.key
          chmod 600 srcs/requirements/nginx/ssl/nginx.key

      - name: Check SSL certificate
        run: |
          test -f srcs/requirements/nginx/ssl/nginx.crt || {
            echo "SSL certificate nginx.crt is missing"
            exit 1
          }

          openssl x509 \
            -in srcs/requirements/nginx/ssl/nginx.crt \
            -noout

      - name: Get runner IP
        id: ip
        run: |
          echo "cidr=$(curl -fsS https://checkip.amazonaws.com)/32" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: ${{ steps.ip.outputs.cidr }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

          terraform apply -input=false -auto-approve

      - name: Get EC2 public IP
        id: ec2
        working-directory: terraform
        run: |
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Create Ansible inventory
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
        run: |
          mkdir -p ansible
          echo "[webservers]" > ansible/inventory.ini
          echo "$EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519" >> ansible/inventory.ini

          cat ansible/inventory.ini

      - name: Wait for EC2 SSH
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
        run: |
          for i in {1..30}; do
            if ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              ubuntu@"$EC2_IP" "echo SSH ready"; then
              exit 0
            fi

            echo "Waiting for EC2 SSH..."
            sleep 10
          done

          echo "EC2 SSH connection failed"
          exit 1

      - name: Check Ansible syntax
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --syntax-check

      - name: Deploy with Ansible
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml
