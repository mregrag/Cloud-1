name: Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get project files
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Check GitHub identity
      - name: Check GitHub repository identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Branch: $GITHUB_REF"

      # 3. Connect to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 5. Install Ansible
      - name: Install Ansible
        run: pip install ansible-core

      # 6. Configure SSH key
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 7. Get GitHub runner IP
      - name: Get runner IP
        id: ip
        run: |
          echo "cidr=$(curl -4 -s https://api.ipify.org)/32" >> "$GITHUB_OUTPUT"

      # 8. Create EC2 with Terraform
      - name: Run Terraform
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
          TF_VAR_allowed_ssh_cidr: ${{ steps.ip.outputs.cidr }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

          terraform apply -input=false -auto-approve

      # 9. Get EC2 public IP
      - name: Get EC2 IP
        id: ec2
        working-directory: terraform
        run: |
          echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

      # 10. Create Ansible inventory
      - name: Create inventory
        run: |
          echo "[webservers]" > inventory.ini
          echo "ec2 ansible_host=${{ steps.ec2.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519" >> inventory.ini

      # 11. Run Ansible
      - name: Run Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook -i inventory.ini ansible/playbook.yml
