services:
  mariadb:
    container_name: mariadb
    image: mariadb:11
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    restart: always

  wordpress:
    container_name: wordpress
    image: wordpress:php8.2-fpm
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    restart: always

  nginx:
    container_name: nginx
    image: nginx:stable
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./requirements/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./requirements/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: always

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    networks:
      - inception
    depends_on:
      - mariadb
    ports:
      - "127.0.0.1:8080:80"
    restart: always

volumes:
  wordpress_data:
    driver: local

  mariadb_data:
    driver: local

networks:
  inception:
    name: inception_net
    driver: bridge
